name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ '**' ]
    paths-ignore:
      - '.devcontainer/**'
      - '.github/**'
      - '.vscode/**'
      - '.gitignore'
      - '.lefthook.yml'
      - 'LICENSE'
      - 'README.md'
      - 'taskfile.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: 9506hqwy/actions/.github/workflows/dotnet-ci.yml@main
    with:
      # because HTML format is 5 GiB over.
      html-report-format: HtmlSummary
